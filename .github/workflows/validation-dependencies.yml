name: Validation dependency snapshot
on:
  push:
    branches: [validation/industrial-v1-20261009]
    paths: [.github/workflows/validation-dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --no-deps --dest wheelhouse 'control==0.10.2' 'build==1.3.0' 'wheel==0.45.1' 'pyproject-hooks==1.2.0'
      - run: sha256sum wheelhouse/* > wheelhouse/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: industrial-v1-validation-dependencies
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 1
