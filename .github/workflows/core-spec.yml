name: Core engineering specification audit
on:
  push:
    paths:
      - 'docs/plan/**'
      - '.github/workflows/core-spec.yml'
  pull_request:
    paths:
      - 'docs/plan/**'
      - '.github/workflows/core-spec.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specification:
    name: Planning contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate requirements, budgets and long-record matrix
        run: python docs/plan/core/tooling/audit_core_spec.py
      - name: Reject mutated or fabricated planning evidence
        run: python -m unittest discover -s docs/plan/core/tooling -p 'test_*.py' -v
      - name: Preserve master-plan contracts
        run: python docs/plan/tooling/audit_plan.py
      - name: Validate repository documentation links
        run: python tools/check_links.py
