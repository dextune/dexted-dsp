name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python examples/basic.py
      - run: python examples/cascade.py
      - run: dexted-dsp check examples/safe.json
      - run: dexted-dsp demo hidden-peak
      - run: python tools/audit_hook.py
      - run: python tools/audit_competitive.py benchmarks/competitive/results/run-20261008.json --archived
      - run: python benchmarks/competitive/plot.py --input benchmarks/competitive/results/run-20261008.json --out benchmarks/competitive/figures --check
      - run: python tools/documentation_smoke.py
      - run: python tools/check_repository_layout.py
      - run: python tools/check_documentation.py
      - run: python tools/check_links.py
      - run: python -m build
      - run: python -m twine check dist/*
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake g++
      - run: python -m pip install .
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python tools/native_cascade_differential.py "$(pwd)/build/libdexted_dsp.so"
      - run: python tools/native_consumer_smoke.py --build-dir build

  native-cross-platform:
    name: native consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install Boost on macOS
        if: runner.os == 'macOS'
        run: brew install boost
      - name: Install Boost multiprecision on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install boost-multiprecision:x64-windows
      - name: Configure CMake on macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python tools/native_consumer_smoke.py --build-dir build

  designed-sos-benchmark-smoke:
    name: synthetic SOS benchmark audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install . 'numpy==2.3.5' 'scipy==1.17.0'
      - run: python benchmarks/suites/generate_design_fixtures.py --check
      - run: python benchmarks/suites/audit_pilot_v2.py validation/pilot_v2/designed_sos_20261008_main_matched.json
      - run: python benchmarks/suites/audit_pilot_v2.py validation/pilot_v2/designed_sos_20261008_linux_shared.json --allow-source-drift
      - run: python benchmarks/suites/run_pilot_v2.py --trials 3 --limit 6 --out validation/pilot_ci_smoke.json
      - run: python benchmarks/suites/audit_pilot_v2.py validation/pilot_ci_smoke.json

  independent-math-oracle:
    name: exact symbolic oracle vs deployed DSP (synthetic EQ)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install . 'sympy==1.14.0'
      - run: python -m unittest discover -s tests -p 'test_eq_catalog.py' -v
      - run: python -m unittest discover -s tests -p 'test_sympy_oracle.py' -v
      - run: python benchmarks/suites/eq_catalog.py --check-sha256 873ce092e2fe7fa7e8d16c8fd50b251f377c05c4a02ed267e6917d7599a69120
      - run: python tools/sympy_oracle_audit.py --count 1200 --split all --oracle-only --output validation/oracle/reference_all_ci.json
      - run: python tools/sympy_oracle_audit.py --count 64 --split holdout --check-reference validation/oracle/reference_holdout_64.json --output validation/oracle/producer_holdout_ci.json
      - run: python examples/eq_release_pipeline.py --max-gain 2.0 --proof validation/oracle/eq_proof_ci.json --report validation/oracle/eq_report_ci.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: exact-oracle-eq-evidence
          path: |
            validation/oracle/*_ci.json
            validation/oracle/*_ci.md
          if-no-files-found: error
          retention-days: 14
