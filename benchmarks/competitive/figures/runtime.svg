<svg xmlns="http://www.w3.org/2000/svg" width="740" height="474" viewBox="0 0 740 474" role="img" aria-labelledby="title desc">
<title id="title">The actual latency cost of verified certification</title>
<desc id="desc">Linear zero-origin scale showing per-case-method wall-time p50 in milliseconds, with p95 in text. Same SciPy/control frequency samples before and after, proof added only after. Shared Linux CI runner and synthetic filters, not a DSP speedup.</desc>
<rect width="740" height="474" rx="18" fill="#0b1425"/>
<text x="30" y="43" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#63ded2">LATENCY TRADE-OFF</text>
<text x="30" y="82" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" fill="#f5f8ff">Stronger checking takes longer.</text>
<text x="30" y="110" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bad2">Wall-clock median / filter (ms), linear scale from zero</text>
<rect x="27" y="133" width="685" height="290" rx="12" fill="#142238"/>
<path d="M 242.0 152 V 397" stroke="#30445f" stroke-dasharray="3 6"/>
<text x="242.0" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">0.00</text>
<path d="M 356.7 152 V 397" stroke="#30445f" stroke-dasharray="3 6"/>
<text x="356.7" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">0.50</text>
<path d="M 471.3 152 V 397" stroke="#30445f" stroke-dasharray="3 6"/>
<text x="471.3" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">1.00</text>
<path d="M 586.0 152 V 397" stroke="#30445f" stroke-dasharray="3 6"/>
<text x="586.0" y="416" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">1.50</text>
<text x="41" y="185" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f8ff">SciPy / before</text>
<rect x="242" y="170" width="52.74" height="19" rx="4" fill="#f5a56b"/>
<text x="685" y="186" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f5a56b">0.230 ms</text>
<text x="685" y="202" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 0.387 ms</text>
<text x="41" y="232" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f8ff">SciPy + proof</text>
<rect x="242" y="217" width="288.42" height="19" rx="4" fill="#63ded2"/>
<text x="685" y="233" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#63ded2">1.258 ms</text>
<text x="685" y="249" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 3.399 ms</text>
<text x="41" y="279" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f8ff">control / before</text>
<rect x="242" y="264" width="49.83" height="19" rx="4" fill="#f5a56b"/>
<text x="685" y="280" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f5a56b">0.217 ms</text>
<text x="685" y="296" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 0.266 ms</text>
<text x="41" y="326" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f8ff">control + proof</text>
<rect x="242" y="311" width="261.84" height="19" rx="4" fill="#63ded2"/>
<text x="685" y="327" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#63ded2">1.142 ms</text>
<text x="685" y="343" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 3.277 ms</text>
<text x="41" y="373" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f8ff">Dexted proof only</text>
<rect x="242" y="358" width="205.70" height="19" rx="4" fill="#63ded2"/>
<text x="685" y="374" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#63ded2">0.897 ms</text>
<text x="685" y="390" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 3.034 ms</text>
<text x="30" y="449" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#63ded2">Added median: SciPy +1.028 ms  |  control +0.924 ms</text>
<text x="30" y="467" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#a9bad2">Differences of pooled medians, not paired overhead  •  p95 labeled separately</text>
</svg>
