<svg xmlns="http://www.w3.org/2000/svg" width="740" height="452" viewBox="0 0 740 452" role="img" aria-labelledby="title desc">
<title id="title">Before/after per-filter runtime, p50 and p95</title>
<desc id="desc">GitHub Actions one shared Linux host; logarithmic axis, milliseconds. SciPy and control compare exactly matched before/after operations; Dexted proof and verifier add cost. No sampling speedup claim.</desc>
<rect width="740" height="452" rx="18" fill="#0b1425"/>
<text x="32" y="43" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#63ded2">THE VERIFICATION COST</text>
<text x="32" y="80" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="750" fill="#f5f8ff">Proof costs time. Here's the bill.</text>
<text x="32" y="108" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bad2">Wall time / filter, median + p95 in ms | shared Linux CI host</text>
<rect x="28" y="132" width="684" height="286" rx="12" fill="#142238"/>
<path d="M 242.00 152 V 370" stroke="#30445f" stroke-dasharray="3 5"/>
<text x="242.0" y="395" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">10^-1</text>
<path d="M 409.50 152 V 370" stroke="#30445f" stroke-dasharray="3 5"/>
<text x="409.5" y="395" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">10^0</text>
<path d="M 577.00 152 V 370" stroke="#30445f" stroke-dasharray="3 5"/>
<text x="577.0" y="395" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a9bad2">10^1</text>
<text x="45" y="182" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#f5f8ff">SciPy</text>
<rect x="242" y="168" width="60.59" height="16" rx="4" fill="#f5a56b"/>
<text x="685" y="182" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f5a56b">0.230</text>
<text x="685" y="197" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 0.387</text>
<text x="45" y="224" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#f5f8ff">SciPy + Dexted</text>
<rect x="242" y="210" width="184.18" height="16" rx="4" fill="#63ded2"/>
<text x="685" y="224" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#63ded2">1.258</text>
<text x="685" y="239" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 3.399</text>
<text x="45" y="266" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#f5f8ff">python-control</text>
<rect x="242" y="252" width="56.45" height="16" rx="4" fill="#f5a56b"/>
<text x="685" y="266" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f5a56b">0.217</text>
<text x="685" y="281" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 0.266</text>
<text x="45" y="308" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#f5f8ff">control + Dexted</text>
<rect x="242" y="294" width="177.14" height="16" rx="4" fill="#63ded2"/>
<text x="685" y="308" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#63ded2">1.142</text>
<text x="685" y="323" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 3.277</text>
<text x="45" y="350" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#f5f8ff">Dexted proof only</text>
<rect x="242" y="336" width="159.59" height="16" rx="4" fill="#63ded2"/>
<text x="685" y="350" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#63ded2">0.897</text>
<text x="685" y="365" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#a9bad2">p95 3.034</text>
<text x="30" y="443" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9bad2">Log10 scale | the total After workflow includes the same sampler + certified proof check</text>
</svg>
